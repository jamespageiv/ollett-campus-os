<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Campus Partner Agent in a team chat (simulated)</title>
<style>
:root{--maroon:#7a1f2b;--gold:#e3a72f;--teal:#1f7a6d;--ink:#14171c;--acc:#5b5fc7;--acc2:#4f52b2;--rail:#2d2c4a;--bg:#f5f5f7;--line:#e1e1e8;--mut:#616670;--card:#fff;--ok:#1f7a6d;--warn:#b26b00;--red:#c4314b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","SF Pro Text",Roboto,Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.4;color:var(--ink);background:#e9e9ef;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
.top{height:44px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 14px}
.shell-lab{font-weight:700;font-size:12.5px;color:var(--acc2);display:flex;align-items:center;gap:8px;white-space:nowrap}
.shell-lab i{width:20px;height:20px;border-radius:6px;background:var(--acc);display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px}
.tog{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:#f2f2f6}
.tog span{font-size:11px;color:var(--mut);padding:5px 4px 5px 10px;font-weight:700}
.tog button{border:0;background:transparent;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;color:var(--ink)}
.tog button.on{background:var(--acc);color:#fff}
.state{display:flex;gap:5px;flex:1;min-width:0;overflow:hidden}
.sp{font-size:10.5px;border:1px solid var(--line);background:#fafafc;border-radius:99px;padding:3px 7px;white-space:nowrap;color:var(--mut)}
.sp b{color:var(--ink)}.sp.ok{border-color:#9ccfc6;background:#eaf6f3}.sp.ok b{color:var(--ok)}
.tb{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink)}
.tb:hover{border-color:var(--acc)}
.main{flex:1;min-height:0;display:grid;grid-template-columns:56px 244px minmax(0,1fr) 316px}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.rail div{width:40px;height:44px;border-radius:8px;display:grid;place-items:center;color:#b9b8d6}
.rail div.on{background:rgba(255,255,255,.14);color:#fff}
.rail svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.chats{background:#f0f0f5;border-right:1px solid var(--line);overflow:auto}
.chats h3{font-size:15px;padding:14px 14px 8px}
.chats .sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:800;padding:10px 14px 4px}
.ci{display:flex;gap:10px;padding:9px 14px;cursor:pointer;border-left:3px solid transparent}
.ci:hover{background:#e8e8f0}.ci.on{background:#fff;border-left-color:var(--acc)}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.av.ag{background:var(--maroon)}.av.pv{background:var(--teal)}.av.sh{background:var(--acc)}.av.ph{background:var(--ink)}.av.me{background:#7b6a3a}
.ci b{display:block;font-size:13px}.ci small{display:block;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:158px}
.convo{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.ch-h{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
.ch-h b{font-size:15px}.ch-h small{color:var(--mut)}
.scenes{display:flex;gap:6px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.scenes button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--mut)}
.scenes button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.scenes button i{font-style:normal;opacity:.7;margin-right:5px}
.thread{flex:1;min-height:0;overflow:auto;padding:14px 18px 10px}
.sep{text-align:center;font-size:11px;color:var(--mut);margin:6px 0 12px;font-weight:700;letter-spacing:.04em}
.m{display:flex;gap:10px;margin-bottom:12px}.m.me{flex-direction:row-reverse}
.m .bd{max-width:640px;min-width:0}
.m .nm{font-size:11.5px;color:var(--mut);margin-bottom:2px}.m.me .nm{text-align:right}
.bub{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.m.me .bub{background:#e8e9fb;border-color:#d3d5f4}
.bub b{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;margin-top:8px;overflow:hidden;cursor:pointer;width:560px;max-width:100%}
.card.sel{box-shadow:0 0 0 2px var(--acc)}
.card.done{border-left-color:var(--ok)}
.card.wide{width:620px}
.cht{display:flex;align-items:center;gap:8px;padding:9px 12px 0}
.cht b{font-size:13.5px}
.cht .sp2{flex:1}
.mk{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px}
.mk.private{background:#f1ecd9;color:#7a5b00}.mk.shared{background:#e3e5fa;color:var(--acc2)}
.mk svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2}
.cb{padding:6px 12px 11px}
.cb p{color:#333;margin:3px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin:6px 0;font-size:13px}.kv span:nth-child(odd){color:var(--mut)}.kv span:nth-child(even){text-align:right;font-weight:700}
.big{font:700 22px Georgia,serif;color:var(--maroon)}
.btns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:center}
.b{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:7px;padding:7px 13px;font-weight:700;font-size:12.5px}
.b:hover{background:var(--acc2)}.b.o{background:#fff;color:var(--acc2)}.b.g{background:var(--teal);border-color:var(--teal)}.b.d{background:#fff;border-color:var(--line);color:var(--mut)}
.b[disabled]{opacity:.45;cursor:default}
.cfm{background:#fff8e8;border:1px dashed var(--gold);border-radius:8px;padding:8px 10px;margin-top:9px;font-size:12.5px}
.cfm .btns{margin-top:6px}
.ok-row{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:700;margin-top:4px}
.ok-row svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4}
.undo{display:flex;align-items:center;gap:10px;margin-top:7px;font-size:12px;color:var(--mut)}
.undo b{font-variant-numeric:tabular-nums;color:var(--ink)}
table.t{width:100%;border-collapse:collapse;margin:6px 0;font-size:12.5px}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:4px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:5px 6px;border-bottom:1px solid #f0f0f4}table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.hl td{background:#fff8e8;font-weight:700}
.doc{border:1px solid #cfd2e6;border-radius:6px;background:#fff;padding:14px 18px;margin-top:6px;font-family:Georgia,serif;font-size:13px;line-height:1.5}
.doc h4{font:700 15px Georgia,serif;margin-bottom:4px}.doc h5{font:700 12px -apple-system,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--maroon);margin:9px 0 2px}
.doc ul{margin:2px 0 2px 18px}.doc:focus{outline:2px solid var(--acc)}
.docbar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#eef0fb;border-bottom:1px solid #d3d5f4;font-size:12px;color:var(--acc2);font-weight:700}
.docbar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:11px;background:#fafafc;margin:2px 4px 2px 0}
.chip.z{font-weight:700}.chip.z.Follett{background:#fbe9ec;border-color:#e9b7bf;color:var(--maroon)}.chip.z.University{background:#e5eefb;border-color:#b6cbee;color:#1f4f9c}.chip.z.CFO-only{background:#f1ecd9;border-color:#e2d49d;color:#7a5b00}
.st{display:inline-block;border-radius:99px;padding:1px 8px;font-size:10.5px;font-weight:700;white-space:nowrap}
.st.have{background:#e3f3ef;color:#13574d}.st.upg{background:#fdf0d4;color:#8a5a00}.st.uni{background:#e5eefb;color:#1f4f9c}.st.neu{background:#eee8fb;color:#5a3eb0}.st.opt{background:#fbe6ef;color:#a22a5e}
.cal-row{display:grid;grid-template-columns:1fr 70px 70px auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f4}
.cal-row small{display:block;color:var(--mut);font-size:11.5px}.cal-row .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.cal-h{display:grid;grid-template-columns:1fr 70px 70px auto;gap:10px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding-bottom:3px;border-bottom:1px solid var(--line)}
.cal-h span:nth-child(2),.cal-h span:nth-child(3){text-align:right}
.chips2{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 4px}
.qc{border:1px solid var(--acc);color:var(--acc2);background:#fff;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600}.qc:hover{background:#eef0fb}
.comp{background:#fff;border-top:1px solid var(--line);padding:9px 14px;display:flex;gap:8px}
.comp input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;outline:none}.comp input:focus{border-color:var(--acc)}
.panel{background:#fff;border-left:1px solid var(--line);overflow:auto;padding:14px 16px}
.panel h3{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc2);font-weight:800;margin-bottom:6px}
.panel h2{font:700 17px Georgia,serif;margin-bottom:8px}
.pb{margin-bottom:14px}.pb>small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:800;margin-bottom:5px}
.src{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin-bottom:5px;font-size:12.5px;animation:lit .5s ease both}
.src:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px rgba(91,95,199,.25);flex:none;margin-right:2px}
.src span:first-of-type{flex:1}
@keyframes lit{from{background:#e5e6fb;transform:translateX(6px);opacity:.3}to{background:#fff;transform:none;opacity:1}}
.wb{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;margin-bottom:4px}.wb svg{flex:none;width:15px;height:15px;margin-top:2px;fill:none;stroke:var(--ok);stroke-width:2.4}
.wb.pend svg{stroke:#b9bcc6}
.lg{display:flex;flex-wrap:wrap;gap:4px}
.log{font-size:11.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:6px;margin-top:4px}.log div{margin-bottom:3px}
.foot{height:26px;flex:none;background:#fff;border-top:1px solid var(--line);padding:0 14px;display:flex;align-items:center;gap:14px;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:8px;padding:9px 16px;font-size:12.5px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(20,23,28,.5);z-index:40;display:none;align-items:center;justify-content:center}.modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;width:900px;max-width:94vw;max-height:88vh;overflow:auto;padding:18px 22px}
.mbox h2{font:700 20px Georgia,serif;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.mtabs{display:flex;gap:6px;margin:8px 0 10px}
.mtabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font-weight:600;font-size:12px}.mtabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.uc{display:grid;grid-template-columns:28px 1fr 130px 60px 70px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #f0f0f4;font-size:12.5px}
.uc small{display:block;color:var(--mut);font-size:11.5px}
.tick{color:var(--ok);font-weight:800}
/* phone scene */
.phwrap{display:flex;gap:34px;align-items:center;justify-content:center;padding:6px 0}
.phs .cht .sp2{display:none}.phs .cht{flex-wrap:wrap;gap:4px}.phs .mk{font-size:9px}
.phone{width:290px;height:520px;border-radius:40px;background:#111;padding:11px;box-shadow:0 18px 40px rgba(0,0,0,.28);flex:none}
.phs{background:#f5f5f7;border-radius:30px;height:100%;overflow:hidden;display:flex;flex-direction:column;position:relative}
.phs .ntch{width:92px;height:22px;background:#111;border-radius:14px;position:absolute;top:7px;left:50%;transform:translateX(-50%)}
.phs .hd{padding:34px 14px 8px;background:#fff;border-bottom:1px solid var(--line);font-weight:700;display:flex;gap:8px;align-items:center}
.phs .hd .av{width:26px;height:26px;font-size:11px}
.phs .bdy{flex:1;overflow:auto;padding:10px}
.phs .card{width:100%;cursor:default}
.phs .big{font-size:18px}
.phcap{max-width:300px;font-size:14px;color:#333}.phcap h3{font:700 20px Georgia,serif;margin-bottom:8px}.phcap p{margin:6px 0}
.lock{background:#f1ecd9;border:1px dashed #d9c77a;border-radius:8px;padding:8px 11px;font-size:12px;color:#6a5100;margin:8px 0}
.blocked{background:#fdeaee;border:1px solid #efb6c2;color:#8a1f37;border-radius:8px;padding:7px 10px;font-size:12px;margin-top:8px}
@media(max-width:1380px){.main{grid-template-columns:52px 214px minmax(0,1fr) 290px}.ci small{max-width:128px}}
</style>
</head>
<body>
<div class="top">
  <div class="shell-lab"><i>T</i>Microsoft Teams (simulated)</div>

</div>
<div class="main">

</div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<script>
(function(){

var S=function(n,s){return {n:n,s:s}};
var EX={
  digest:{t:'7:00 digest',ag:['inv','com','evt'],src:[S('Registrar add/drop census file','have'),S('Billing invoice register','have'),S('POS lines and contract rate card','have'),S('Parents Weekend plan and model','have')],zone:'Follett',wb:[['Three cards posted to the chat',1],['Nothing is written until the CFO taps',0]],uc:'1, 2, 5'},

/* an action card that is open, then confirmed, then a receipt with a 15 minute undo */
function actionCard(o){
  var s=st(),done=!!s[o.sk];
  if(done){
    if(!V.undoAt[o.key])V.undoAt[o.key]=Date.now()+15*60000;
    var left=V.undoAt[o.key]-Date.now();
    var undo=o.noUndo?'':(left>0?'<div class="undo"><span>Undo available for <b data-undo="'+o.key+'">'+fmtT(left)+'</b></span><button class="b d" data-a="undo" data-k="'+o.key+'">Undo</button></div>':'<div class="undo">Logged. Undo window closed.</div>');
    return card(o.x,o.title,o.kind,'<div class="ok-row">'+SVG.check+esc(o.doneTitle)+'</div><p>'+o.doneDetail+'</p>'+undo,'done '+(o.cls||''));
  }
  var act=V.pending[o.key]
   ?'<div class="cfm"><b>Confirm:</b> '+o.confirm+'<div class="btns"><button class="b g" data-a="yes" data-k="'+o.key+'">Confirm</button><button class="b d" data-a="no" data-k="'+o.key+'">Cancel</button></div></div>'
   :'<div class="btns"><button class="b" data-a="go" data-k="'+o.key+'">'+esc(o.label)+'</button>'+(o.alt||'')+'</div>';
  return card(o.x,o.title,o.kind,o.body+act,o.cls);
}

  if(id==='accessplan')return bub('<b>'+p.clusters.length+' departments</b> ('+p.clusters.join(', ')+') cluster on Access and peers already moved.')+card('accessplan','Save-students proposal','private','<div class="kv"><span>Modeled student savings</span><span>$'+p.saveStudentsM+'M</span><span>Follett revenue</span><span>$'+p.follettRevM+'M</span></div><p style="color:var(--mut);font-size:12px">Both numbers shown side by side.</p>'+srcRow('Follett',['Adoption by department','Faculty adoption signals']),'')+ac('accessplan');
  if(id==='outcome')return bub('Access cohort retention is <b>'+oc.access.retention+'%</b> against <b>'+oc.non.retention+'%</b> for the non-Access cohort, a difference of <b>'+(oc.access.retention-oc.non.retention).toFixed(1)+' points</b>. Aggregate only. Source: '+oc.source+'.')+srcRow('University',['Institutional Research aggregates','Access enrollment flags'])+ac('outcome');
  if(id==='services')return bub('First-year move-in add-on: <b>'+v.lines.join(', ')+'</b>. Modeled attach rate <b>'+v.attachPct+'%</b>. Invoice impact before you approve: about <b>$'+v.invoiceImpactK+'K</b> on the next preview. '+esc(v.benefit)+'.')+srcRow('Follett',['First-year move-in roster (aggregate)','Delivery partner status','Access invoice preview'])+ac('services');
  if(id==='renew')return bub('Readiness is <b>'+NF.renewal.score+'/100</b>. Agreement ends '+NF.contract.ends+'. The board summary is drafted.')+'<div class="btns"><button class="b" data-a="scene" data-k="4">Open the board memo</button></div>'+srcRow('CFO-only',['Renewal scorecard','Peer commission benchmark']);
  if(id==='private')return card('ask','Talking points for the Provost (draft)','private','<ul style="margin-left:18px"><li>Five gateway courses are below 70% week-6 access. Ask for a joint outreach plan.</li><li>The Access cohort retains '+(oc.access.retention-oc.non.retention).toFixed(1)+' points better in aggregate.</li><li>Business College affordability review opens before Nov 14.</li></ul><div class="chips2"><span class="chip z CFO-only">CFO-only zone</span></div><div class="btns"><button class="b d" data-a="memoShare">Share to partnership channel</button></div>'+(V.memoShareBlocked?'<div class="blocked">Blocked. The CFO-only zone never posts to the shared Follett channel.</div>':''),'');
  return bub('I can answer from governed campus data only. For "'+esc(q)+'", the closest governed views are the disputes ($212.0K), commission variance ($41.8K), affordability, gateway courses and renewal. Pick one of the suggestions above, or rephrase.')+srcRow('CFO-only',['Governed campus data only']);
}
function route(q){var t=q.toLowerCase();
  if(/opt.?out|afford|price|reprice/.test(t))return'afford';if(/pop.?up|arena|first.?time|event|homecoming/.test(t))return'event';
  if(/expan|access|save student|proposal/.test(t)&&!/stay|retain|outcome/.test(t))return'accessplan';if(/stay|retain|outcome|enrol/.test(t))return'outcome';
  if(/service|dorm|device|move.?in|deliver/.test(t))return'services';if(/renew|board|rfp/.test(t))return'renew';if(/private|talking|provost|draft/.test(t))return'private';return'other'}

/* shared channel */
function sharedHTML(){
  var s=st(),cal=s.calendar||{},posts=[];
  if(s.released)posts.push(['release','Census date confirmed','7 invoices released ($110.2K). Open disputes now '+KD(B.live.disputed())+'.']);
  if(s.commissionCredit)posts.push(['commission','Commission credit requested','$41.8K with 4 variance lines, requested for this week.']);
  if(s.campaign)posts.push(['campaign','Parents Weekend approved','$10K approved. Creative released.']);
  if(s.eventRepeat)posts.push(['event','Pop-up added to the spring home opener','Added to the event calendar.']);
  var nc=Object.keys(cal).filter(function(k){return cal[k]}).length;if(nc)posts.push(['calendar','Spring calendar','"'+nc+' of '+D.CALENDAR.length+' lines approved and written to the event calendar."']);
  if(s.services)posts.push(['services','Services add-on approved','Added to the next Access invoice preview.']);
  if(s.accessPaid)posts.push(['pay','Fall Access invoice payment scheduled','$2.44M due Nov 20. Days-to-pay moves from '+NF.daysToPay.before+' to '+NF.daysToPay.after+'.']);
  var h='<div class="sep">Shared channel</div><div class="lock">Members: Dana Whitfield, the Northfield store director and the Group Vice President, East. <b>The CFO-only zone (private workspace answers, board memo drafts) never posts here.</b> Every card carries a marker.</div>';
  if(!posts.length)h+='<div class="sep">No shared updates yet. Approve something in the 1:1 chat and the agent posts a one line update here.</div>';
  posts.forEach(function(p){h+=msg('ag','Campus Partner Agent','just now',card(p[0],p[1],'shared','<p>'+p[2]+'</p><div style="font-size:11.5px;color:var(--mut)">Posted after CFO approval. No student data.</div>',''))});
  return h;
}

/* ---------- chrome ---------- */
function chatsHTML(){
  var items=[['agent','ag','CA','Campus Partner Agent','Good morning, Dana. Three things need you','1:1'],['meet','pv','PV','Fall retention review (meeting chat)','@Campus Partner Agent which gateway...','Meeting'],['shared','sh','NF','Northfield x Follett Partnership','Shared channel with Follett','Channel'],['phone','ph','PH','Mobile: Campus Partner Agent','Quick one between meetings, Dana','Phone']];
  return '<h3>Chat</h3><div class="sec">Recent</div>'+items.map(function(i){return '<div class="ci '+(V.chat===i[0]?'on':'')+'" data-a="chat" data-k="'+i[0]+'"><div class="av '+i[1]+'">'+i[2]+'</div><div><b>'+esc(i[3])+'</b><small>'+esc(i[4])+'</small></div></div>'}).join('')
   +'<div class="sec">How it works</div><div style="padding:4px 14px 14px;font-size:12px;color:var(--mut)">No app to open. The agent comes to the chat. Approve with a card, ask in plain language, and every action is logged and can be undone for 15 minutes.</div>';
}
function headHTML(){
  var t={agent:['Campus Partner Agent','1:1 with Dana Whitfield, VP Finance and CFO','private'],meet:['Fall retention review','Meeting chat with the Provost and Institutional Research','private'],shared:['Northfield x Follett Partnership','Shared channel. Follett can see everything posted here.','shared'],phone:['Mobile: Campus Partner Agent','Phone view of the same chat','private']}[V.chat];
  return '<div class="av '+({agent:'ag',meet:'pv',shared:'sh',phone:'ph'}[V.chat])+'">'+({agent:'CA',meet:'PV',shared:'NF',phone:'PH'}[V.chat])+'</div><div><b>'+t[0]+'</b><br><small>'+t[1]+'</small></div><span style="flex:1"></span>'+mk(t[2]);
}
function scenesHTML(){return SCENES.map(function(x){return '<button class="'+(V.scene===x.n?'on':'')+'" data-a="scene" data-k="'+x.n+'"><i>'+x.n+'</i>'+esc(x.t)+'</button>'}).join('')}
function stateHTML(){
  var s=st(),L=B.live,cal=Object.keys(s.calendar||{}).filter(function(k){return s.calendar[k]}).length;
  return '<span class="sp '+(s.released?'ok':'')+'">Disputes <b>'+KD(L.disputed())+'</b></span><span class="sp '+(s.commissionCredit?'ok':'')+'">Variance <b>'+KD(L.commissionVariance())+'</b></span><span class="sp '+(s.campaign?'ok':'')+'">Campaign <b>'+(s.campaign?'approved':'pending')+'</b></span><span class="sp '+(s.accessPaid?'ok':'')+'">$2.44M <b>'+(s.accessPaid?'scheduled':'pending')+'</b></span><span class="sp '+(s.accessPaid?'ok':'')+'">Days-to-pay <b>'+L.daysToPay()+'</b></span>';
}
function compHTML(){
  if(V.chat==='meet')return V.meetSent?'<input placeholder="Type a message" disabled><button class="b" disabled>Send</button>':'<input id="cin" value="@Campus Partner Agent which gateway courses are slipping"><button class="b" data-a="meetSend">Send</button>';
  if(V.chat==='agent')return '<input id="cin" placeholder="Ask the agent in plain language, for example: why did Business opt-outs double?"><button class="b" data-a="askSend">Send</button>';
  return '<input placeholder="'+(V.chat==='shared'?'Posts here are visible to Follett':'Type a message')+'" disabled><button class="b" disabled>Send</button>';
}
function threadHTML(){
  if(V.chat==='shared')return sharedHTML();
  if(V.chat==='phone')return phoneHTML();
  if(V.chat==='meet')return sc3();
  return [null,sc1,sc2,sc3,sc4,sc5,sc6,phoneHTML,askScene][V.scene===3||V.scene===7?1:V.scene]();
}
function render(keepScroll){
  var th=$('#thread'),top=th.scrollTop;
  $('#chats').innerHTML=chatsHTML();$('#chh').innerHTML=headHTML();$('#scenes').innerHTML=scenesHTML();$('#state').innerHTML=stateHTML();
  th.innerHTML=threadHTML();$('#comp').innerHTML=compHTML();panel();
  if(keepScroll)th.scrollTop=top;
}
function flash(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(flash.h);flash.h=setTimeout(function(){e.classList.remove('on')},2400)}

/* ---------- actions ---------- */
var DO={
  release:function(){B.set('released',true,'Teams','Confirmed census date, released 7 invoices ($110.2K)')},
  commission:function(){B.set('commissionCredit',true,'Teams','Requested $41.8K commission credit with 4 variance lines')},
  campaign:function(){B.set('campaign',true,'Teams','Approved $10K Parents Weekend campaign')},
  pay:function(){B.set('accessPaid',true,'Teams','Approved $2.44M fall Access invoice')},
  afford:function(){B.set('adoptionReview',true,'Teams','Opened spring adoption review before Nov 14')},
  provost:function(){B.set('provostReport',true,'Teams','Sent course-level gateway report to the Provost')},
  event:function(){B.set('eventRepeat',true,'Teams','Repeat Arena Store pop-up at the spring home opener')},
  accessplan:function(){B.set('accessPlan',true,'Teams','Sent Access expansion proposal to the Provost')},
  outcome:function(){B.set('outcome',true,'Teams','Shared aggregate outcome proof with the Provost and board packet')},
  services:function(){B.set('services',true,'Teams','Approved services add-on on the Access invoice preview')}
};
var UNDO={release:['released','Undid the census date release'],commission:['commissionCredit','Withdrew the commission credit request'],campaign:['campaign','Undid the Parents Weekend approval'],pay:['accessPaid','Undid the Access invoice payment'],afford:['adoptionReview','Closed the adoption review'],provost:['provostReport','Recalled the Provost report'],event:['eventRepeat','Removed the spring pop-up'],accessplan:['accessPlan','Recalled the Access proposal'],outcome:['outcome','Recalled the outcome proof'],services:['services','Removed the services add-on']};
var SCENE_FOR={afford:8,event:8,accessplan:8,outcome:8,services:8};
var H={
  go:function(k){V.pending[k]=true;render(1);setSel(({provost:'gateway'})[k]||k)},
  no:function(k){V.pending[k]=false;render(1)},
  yes:function(k){V.pending[k]=false;DO[k]();V.undoAt[k]=Date.now()+15*60000;flash('Done. Logged, and you can undo it for 15 minutes.')},
  undo:function(k){var u=UNDO[k];B.set(u[0],false,'Teams',u[1]);V.undoAt[k]=null;flash('Undone')},
  scene:function(k){goScene(+k)},
  chat:function(k){V.chat=k;if(k==='agent'&&(V.scene===3||V.scene===7||V.scene===0))V.scene=1;if(k==='meet')V.scene=3;if(k==='phone')V.scene=7;if(k==='shared'){V.scene=0}render();$('#thread').scrollTop=0},
  meetSend:function(){V.meetSent=true;render();setSel('gateway');var t=$('#thread');t.scrollTop=t.scrollHeight},
  askSend:function(){var i=$('#cin');var q=i&&i.value.trim();if(!q)return;ask(route(q),q)},
  q:function(k){var m={afford:'Why did Business opt-outs double?',event:'How did the Arena Store pop-up do?',accessplan:'Propose an Access expansion',outcome:'Do Access students stay enrolled more?',services:'Add services to Access for first-years?',renew:'Where do we stand on renewal?','private':'Draft talking points for the Provost (private)'};ask(k,m[k])},
  fwd:function(){V.fwd=true;render(1)},
  memoOpen:function(){V.memoOpened=true;render(1)},
  memoAsk:function(){V.memoConfirm=true;render(1)},
  memoNo:function(){V.memoConfirm=false;render(1)},
  memoSend:function(){V.memoConfirm=false;V.memoSent=true;render(1);flash('Sent after your confirmation')},
  memoShare:function(){V.memoShareBlocked=true;render(1);setSel('memo')},
  calOn:function(k){var c=Object.assign({},st().calendar||{});c[k]=true;B.set('calendar',c,'Teams','Approved spring calendar line: '+lineName(k))},
  calOff:function(k){var c=Object.assign({},st().calendar||{});delete c[k];B.set('calendar',c,'Teams','Removed spring calendar line: '+lineName(k))},
  calAll:function(){var c={};D.CALENDAR.forEach(function(l){c[l.id]=true});B.set('calendar',c,'Teams','Approved all '+D.CALENDAR.length+' spring calendar lines')},
  cmtOpen:function(k){V.openCmt=k;render(1);var i=$('#cmtIn');if(i)i.focus()},
  cmtSend:function(k){var i=$('#cmtIn');if(i&&i.value.trim()){V.cmt[k]=i.value.trim();flash('Comment sent to Campus Commerce')}V.openCmt=null;render(1)}
};
function lineName(k){return D.CALENDAR.filter(function(l){return l.id===k})[0].n}
function ask(id,q){V.chat='agent';V.scene=8;V.asks.push({id:id,q:q,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});render();setSel(id==='other'?'ask':id==='renew'?'memo':id==='private'?'ask':id);var t=$('#thread');t.scrollTop=t.scrollHeight}
function goScene(n){
  var s=SCENES.filter(function(x){return x.n===n})[0];
  V.scene=n;V.chat=s.chat;V.sel=s.key;
  if(n===4&&!st().memo)B.set('memo',true,'Teams','Renewal agent drafted the board finance summary for Nov 12');
  render();$('#thread').scrollTop=0;
}
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-a]');
  if(a&&H[a.dataset.a]){e.stopPropagation();H[a.dataset.a](a.dataset.k);return}
  var c=e.target.closest('.card[data-x]');if(c)setSel(c.dataset.x);
});
document.addEventListener('input',function(e){if(e.target.id==='memoDoc')V.memoHtml=e.target.innerHTML});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='cin'){e.preventDefault();if(V.chat==='meet')H.meetSend();else H.askSend()}});

/* capability map and use cases */
var CAP=[['Morning brief','Home insight feed','Proactive 7:00 digest in the 1:1 chat, 3 action cards'],['Approve or confirm','Button on an insight','Card action, confirm step, receipt card, 15 minute undo'],['Ask anything','Copilot drawer','1:1 chat or @mention in any chat or meeting, answers with source chips and a zone label'],['Financial drill','Financials tab','"Show me" returns a compact chart card plus table, with export'],['Board memo','Modal draft','A Word-style file posted to the chat, edit it, sending needs an explicit confirm'],['Early-warning routing','Send to Provost','Forward the card into a group chat with the Provost, aggregate only'],['Renewal','Readiness tab','Readiness card, plus the agent adds a prep block to your calendar'],['Shared with Follett','None','Optional shared channel "Northfield x Follett Partnership". Every card is marked Private or Shared. The CFO-only zone never posts there'],['Mobile','Not applicable','Phone vignette: approve between meetings']];
var UCREACH={1:[1,'Scene 1 and 2'],2:[1,'Scene 1'],3:['q:afford','Ask'],4:[3,'Scene 3'],5:[1,'Scene 1 and phone'],6:[4,'Scene 4'],7:['q:event','Ask'],8:[5,'Scene 5'],9:[8,'Ask anything'],10:['q:accessplan','Ask'],11:['q:outcome','Ask'],12:[6,'Scene 6'],13:['q:services','Ask']};
var UCDONE={1:'released',2:'commissionCredit',3:'adoptionReview',4:'provostReport',5:'campaign',6:'memo',7:'eventRepeat',8:'accessPaid',10:'accessPlan',11:'outcome',13:'services'};
function modal(){
  var s=st();
  var t=V.tab==='map'
   ?'<table class="t"><tr><th>Capability</th><th>Command Center</th><th>Teams (headless)</th></tr>'+CAP.map(function(r){return '<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>'}).join('')+'</table>'
   :D.USECASES.map(function(u){var r=UCREACH[u.id],d=u.id===12?Object.keys(s.calendar||{}).some(function(k){return s.calendar[k]}):(u.id===9?V.asks.length>0:s[UCDONE[u.id]]);
      return '<div class="uc"><b>'+u.id+'</b><div><b>'+esc(u.n)+'</b>'+(u.isNew?' <span class="st neu">New</span>':'')+'<small>'+esc(u.action)+'</small></div><div style="color:var(--mut)">'+esc(agent(u.agent).n)+'</div><div class="'+(d?'tick':'')+'">'+(d?'Done':'')+'</div><button class="b o" data-m="'+(typeof r[0]==='string'?r[0]:'s:'+r[0])+'">'+esc(r[1])+'</button></div>'}).join('');
  $('#mbox').innerHTML='<h2>Same agents, different surface <button class="b d" data-m="close">Close</button></h2><div class="mtabs"><button class="'+(V.tab==='map'?'on':'')+'" data-m="tab:map">Capability map</button><button class="'+(V.tab==='uc'?'on':'')+'" data-m="tab:uc">All 13 use cases</button></div>'+t+'<p style="margin-top:10px;font-size:11.5px;color:var(--mut)">Illustrative simulation. Experience, not software.</p>';
}
$('#bMap').onclick=function(){V.tab='map';modal();$('#modal').classList.add('on')};
document.addEventListener('click',function(e){
  var m=e.target.closest('[data-m]');if(m){var v=m.dataset.m;
    if(v==='close')$('#modal').classList.remove('on');
    else if(v.indexOf('tab:')===0){V.tab=v.slice(4);modal()}
    else if(v.indexOf('q:')===0){$('#modal').classList.remove('on');H.q(v.slice(2))}
    else if(v.indexOf('s:')===0){$('#modal').classList.remove('on');goScene(+v.slice(2))}
    return}
  if(e.target.id==='modal')$('#modal').classList.remove('on');
});
$('#goCfo').onclick=function(){try{window.parent.postMessage({campusosNav:'cfo'},'*')}catch(e){}flash('Switching to the Command Center. Same agents, same state.')};
$('#goTeams').onclick=function(){flash('You are in the Teams surface')};
$('#bReset').onclick=function(){B.reset();V.undoAt={};V.pending={};V.asks=[];V.meetSent=false;V.memoSent=false;V.memoConfirm=false;V.memoOpened=false;V.memoShareBlocked=false;V.fwd=false;V.cmt={};V.memoHtml=null;goScene(1);flash('Demo state reset on every surface')};

/* shared state: reflect approvals made on the other surface */
B.on(function(type,payload,state,remote){
  render(1);if(remote&&type!=='sync'&&type!=='log')flash('Updated from the other surface');
  if(!$('#modal').classList.contains('on'))return;modal();
});
/* undo countdown */
setInterval(function(){
  var changed=false;
  document.querySelectorAll('[data-undo]').forEach(function(el){var l=V.undoAt[el.dataset.undo]-Date.now();if(l<=0)changed=true;else el.textContent=fmtT(l)});
  if(changed)render(1);
},1000);

goScene(1);
})();
</script>
