<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner Command Center | Northfield State</title>
<style>
:root{
  --bg:#f4f4f3;--card:#fff;--line:#dcdfe4;--ink:#111418;--mut:#5d6672;--faint:#8b94a0;
  --blue:#0b5cd5;--blue-d:#0847a8;--blue-l:#e8f0fd;
  --green:#0a8f5b;--green-l:#e3f6ed;--red:#c62828;--red-l:#fdeaea;--amber:#b86e00;--amber-l:#fff1d9;
  --clay:#c96442;--clay-l:#fbece6;--purple:#6b4bd6;--purple-l:#efeafc;
  --maroon:#7a1f2b;--gold:#e3a72f;--teal:#1f7a6d;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#fff;border-bottom:0;position:relative}
.top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--maroon) 0 33%,var(--gold) 33% 66%,var(--teal) 66%)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--maroon);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;letter-spacing:.5px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--mut);margin-top:-2px}
.sep{width:1px;height:28px;background:var(--line)}
.chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600;background:#fff}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.chip em{font-style:normal;color:var(--green);font-weight:500;font-size:11px}
.bell{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;cursor:pointer}
.bell b{position:absolute;top:-2px;right:-2px;background:#e53935;color:#fff;border-radius:99px;font-size:10px;padding:1px 5px}
.avatar{width:34px;height:34px;border-radius:50%;background:#e9ebee;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mut)}
/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:0}
.nav{background:#fff;border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;overflow:auto}
.btn-new{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:600;width:100%}
.btn-new:hover{background:#f7f8fa}
.nav h6{margin:20px 8px 6px;font-size:11px;letter-spacing:.09em;color:var(--mut);font-weight:700;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;font-weight:500;color:#222;border:2px solid transparent;margin-bottom:2px}
.ni:hover{background:#f3f4f6}
.ni.on{background:#eef0f3;font-weight:600}
.ni .n{margin-left:auto;font-size:12px;color:var(--mut)}
.ni .n.hot{background:#e53935;color:#fff;border-radius:99px;padding:0 7px;font-weight:700}
.ni svg{flex:none}
.navfoot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;gap:10px;align-items:center}
.navfoot small{display:block;color:var(--mut);font-size:11px}
.main{display:grid;grid-template-columns:1fr 340px;min-width:0;min-height:0}
.main.norail{grid-template-columns:1fr}
.page{overflow:auto;padding:22px 28px 40px;min-width:0}
.rail{border-left:1px solid var(--line);background:#fff;padding:20px 18px;overflow:auto}
.rail h5,.sec{font-size:11px;letter-spacing:.1em;color:var(--mut);font-weight:700;text-transform:uppercase;margin:0 0 10px}
.railhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
/* generic */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card h3{margin:0 0 4px;font-size:16px}
.sub{color:var(--mut);font-size:13px}
.h1{font-size:26px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.row{display:flex;gap:14px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mt{margin-top:18px}.mt2{margin-top:28px}
.tile{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.tile .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.tile .v{font-size:25px;font-weight:700;margin:4px 0 2px;letter-spacing:-.02em}
.tile .s{font-size:12px;color:var(--mut)}
.tile .s.up{color:var(--green);font-weight:600}.tile .s.dn{color:var(--red);font-weight:600}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--blue)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 11px;border-radius:99px;border:1.5px solid}
.tag.Risk{color:var(--red);border-color:#f0b8b8;background:#fff}
.tag.Opportunity{color:var(--green);border-color:#a8dcc3;background:var(--green-l)}
.tag.Renewal{color:var(--blue);border-color:#b9cff3;background:var(--blue-l)}
.tag.Cash{color:var(--amber);border-color:#f0d49a;background:var(--amber-l)}
.new{background:#ff9800;color:#fff;font-weight:700;font-size:12px;padding:3px 11px;border-radius:99px}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px}
.pill.red{background:var(--red-l);color:var(--red)}.pill.green{background:var(--green-l);color:var(--green)}
.pill.amber{background:var(--amber-l);color:var(--amber)}.pill.blue{background:var(--blue-l);color:var(--blue)}
.pill.gray{background:#eceef1;color:var(--mut)}.pill.clay{background:var(--clay-l);color:var(--clay)}
.btn{border:1px solid var(--line);background:#f1f2f4;border-radius:9px;padding:7px 13px;font-weight:600;font-size:13px}
.btn:hover{background:#e6e8ec}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-d)}
.btn.ghost{background:#fff}
.btn.done{background:var(--green-l);border-color:#a8dcc3;color:var(--green);cursor:default}
.btn.sm{padding:4px 10px;font-size:12px}
.link{color:var(--blue);cursor:pointer;font-weight:500}.link:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);font-weight:700}
td{padding:9px 10px;border-bottom:1px solid #eceef1;vertical-align:middle}
td.r,th.r{text-align:right}
tr.clk{cursor:pointer}tr.clk:hover td{background:#f8f9fb}
.bar{height:8px;background:#eceef1;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.bar.red>i{background:#e53935}.bar.green>i{background:var(--green)}.bar.amber>i{background:#f0a21b}
/* insight cards */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ic{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ic .hd{display:flex;align-items:center;gap:8px}
.ic .hd .sp{flex:1}
.ic .x{border:0;background:none;font-size:18px;color:var(--mut);padding:0 4px}
.ic h4{margin:2px 0 0;font-size:16px}
.ic p{margin:0;color:#2b3138;font-size:13.5px}
.ic .rec{display:flex;gap:8px;color:#2b3138;font-size:13px}
.ic .rec svg{flex:none;margin-top:2px}
.ic .meta{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:12.5px}
.ic .ft{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto}
.ic .ft .who{font-size:12.5px;color:var(--mut)}
.ic .ft .who div{display:flex;gap:6px;align-items:center}
.ic.cleared{opacity:.55}
/* section header */
.sech{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;margin:0 0 12px}
.sech .badge{background:#e53935;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.sech .sp{flex:1}
/* rail items */
.dealrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eef0f2;font-size:13.5px}
.dealrow .nm{color:var(--blue);font-weight:500;flex:1;cursor:pointer}
.dealrow .st{font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;min-width:64px}
.dealrow .st i{width:7px;height:7px;border-radius:50%;display:inline-block}
.nba{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:10px;cursor:pointer;background:#fff}
.nba:hover{border-color:var(--blue)}
.nba .ico{width:32px;height:32px;border-radius:8px;background:var(--blue-l);display:grid;place-items:center;flex:none}
.nba b{font-size:13.5px;display:block}.nba span{font-size:12px;color:var(--mut)}
.nba .imp{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;height:max-content;white-space:nowrap}
.imp.hr{background:var(--red-l);color:var(--red)}.imp.hi{background:var(--amber-l);color:var(--amber)}
/* chat */
.chatwrap{display:flex;flex-direction:column;height:100%;min-height:0}
.agentbar{display:flex;align-items:center;gap:10px}
.agentsel{white-space:nowrap;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;letter-spacing:.06em;font-size:13px}
.agentsel .live{background:var(--green-l);color:var(--green);font-size:11px;padding:2px 9px;border-radius:99px;letter-spacing:0}
.agentbar .sp{flex:1}
.gbtn{white-space:nowrap;display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;letter-spacing:.06em;font-size:12.5px;color:#333}
.gbtn:hover{background:#f7f8fa}
.greet{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:26px 0 8px}
.greetp{font-size:18px;color:#4b5560;margin:0 0 20px;line-height:1.5}
.greetp b{color:#000}
.pchips{display:flex;flex-wrap:wrap;gap:10px}
.pchip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:11px 18px;font-size:14px;color:#333;text-align:left}
.pchip:hover{border-color:var(--blue);color:var(--blue)}
.thread{flex:1;overflow:auto;padding:6px 2px 10px}
.msg{margin:14px 0;display:flex;flex-direction:column;gap:8px}
.msg.u{align-items:flex-end}
.bub{background:#fff;border:1.5px solid var(--line);padding:10px 14px;border-radius:14px 14px 4px 14px;max-width:80%}
.msg.a .who{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--clay);letter-spacing:.04em}
.spark{width:18px;height:18px;border-radius:6px;background:var(--clay);display:grid;place-items:center}
.trace{font-size:12.5px;color:var(--mut);border-left:2px solid var(--line);padding-left:10px;display:flex;flex-direction:column;gap:3px}
.trace .ok{color:var(--green)}
.trace .spin{display:inline-block;width:9px;height:9px;border:2px solid var(--line);border-top-color:var(--clay);border-radius:50%;animation:sp 0.7s linear infinite;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.blk{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.blk p{margin:0 0 8px;font-size:14.5px;line-height:1.55}
.blk .tbl{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.blk .note{font-size:12px;color:var(--mut);margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stats .tile .v{font-size:21px}
.abox{border:1.5px solid #b9cff3;background:var(--blue-l);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.abox .t{flex:1}.abox b{display:block}.abox span{font-size:12.5px;color:#34506f}
.srcs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--mut)}
.srcs span.s{border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 9px}
.followups{display:flex;gap:8px;flex-wrap:wrap}
.followups button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-size:13px}
.followups button:hover{border-color:var(--blue);color:var(--blue)}
.inputbar{border:1.5px solid var(--line);background:#fff;border-radius:16px;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;margin-top:8px}
.inputbar input{flex:1;border:0;outline:0;font:inherit;font-size:15px;background:none;padding:6px 0}
.send{width:36px;height:36px;border-radius:50%;border:0;background:#8aa9f0;color:#fff;display:grid;place-items:center}
.send.on{background:var(--blue)}
.fine{text-align:center;color:var(--mut);font-size:12px;margin:10px 0 0}
/* drawer & fab */
.fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;background:var(--blue);border:0;color:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(11,92,213,.4);z-index:30}
.fab.hide{display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);border-left:1.5px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .25s;z-index:40;display:flex;flex-direction:column;padding:16px}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ctx{font-size:12px;color:var(--mut);margin-bottom:8px}
/* toast / modal */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#14212f;color:#fff;border-radius:12px;padding:11px 16px;font-size:13.5px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;max-width:90%}
.toast.on{display:block;animation:fade .25s}
.modalbg{position:fixed;inset:0;background:rgba(10,18,30,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.modalbg.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:26px 30px}
.modal h2{margin:0 0 4px}
.memo p{margin:0 0 10px;font-size:14px}
.memo h4{margin:16px 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:7px 14px;font-size:13px;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue);color:#fff}
.tl{position:relative;height:96px;margin:6px 10px 0}
.tl .ln{position:absolute;left:0;right:0;top:44px;height:6px;border-radius:99px;background:#e1e5ea}
.tl .done{position:absolute;left:0;top:44px;height:6px;border-radius:99px;background:var(--teal)}
.tl .m{position:absolute;top:36px;transform:translateX(-50%);text-align:center;width:96px;font-size:11px}
.tl .m i{display:block;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--maroon);margin:0 auto 4px}
.tl .m.now i{background:var(--clay);border-color:var(--clay);width:18px;height:18px;margin-top:-2px}
.tl .m.up i{border-color:var(--gold)}
.tl .m.top{top:-4px}.tl .m.top i{margin-top:56px}
.tl .m.top span{position:absolute;top:0;left:0;right:0}
.tl .m b{display:block;font-size:11.5px}
input[type=range]{width:100%}
.slrow{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.slrow b{text-align:right}
.ring{width:130px;height:130px;flex:none}
.empty{color:var(--mut);font-style:italic;padding:8px 0}
.notice{border:1.5px dashed #c9ced6;border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--mut);background:#fafbfc}
@media(max-width:1180px){.main{grid-template-columns:1fr}.rail{display:none}.grid4{grid-template-columns:repeat(2,1fr)}.chips .chip:nth-child(n+3){display:none}}
@media(max-width:820px){.shell{grid-template-columns:64px 1fr}.nav h6,.ni span.t,.btn-new span,.navfoot div,.ni .n{display:none}.ni{justify-content:center}.grid2,.grid3{grid-template-columns:1fr}.page{padding:16px}.chips{display:none}.greet{font-size:24px}}

.foot{padding:5px 18px;border-top:1px solid var(--line);background:#fff;font-size:11px;color:var(--mut);display:flex;gap:14px;justify-content:space-between;align-items:center}
.igrid .span2{grid-column:span 2}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:2px 0}
.ic .tile{padding:9px 10px}.ic .tile .v{font-size:19px}.ic .tile .l{font-size:9.5px}.ic .tile .s{font-size:11.5px}.ic .stats{gap:8px}
.tri>div{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px;background:#fafbfc}
.tri span{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:2px}
.zone{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 11px}
.zone.Follett{background:var(--clay-l);color:var(--clay)}.zone.University{background:var(--blue-l);color:var(--blue)}.zone.CFO{background:var(--purple-l);color:var(--purple)}.zone.Enriched{background:var(--green-l);color:var(--green)}
.tiechip{cursor:pointer;border:1.5px solid #b9cff3;background:var(--blue-l);color:var(--blue);font-weight:700;font-size:12px;border-radius:99px;padding:3px 11px}
.tiechip:hover{background:#d8e6fb}
.cal td{font-size:12.5px;padding:7px 8px}.cal tr.st-approved td{background:#f1faf5}.cal tr.st-comment td{background:#fff8ec}
.cal input{border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;width:100%}
.zgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.zgrid .tile b{display:block;margin-bottom:2px}.zgrid .tile .sub{font-size:12px}
.fine2{font-size:11.5px;color:var(--mut)}
.ag td{font-size:12.5px}
@media(max-width:1180px){.igrid .span2{grid-column:span 1}.zgrid{grid-template-columns:1fr 1fr}.tri{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">PCC</div><div>Partner Command Center<small>Northfield State University</small></div></div>
    <div class="sep"></div>
    <div style="font-weight:600;font-size:15px" id="topTitle">CFO Workspace</div>
    <div class="chips">
      <div class="chip">Follett POS <i></i><em>Live</em></div>
      <div class="chip">CourseTracks <i></i><em>Live</em></div>
      <div class="chip">Registrar SIS <i></i><em>Live</em></div>
      <div class="chip">Revenue Cloud <i></i><em>Live</em></div>
    </div>
    <button class="btn sm" data-reset title="Clear every approval on every surface" style="margin-right:6px">Reset demo</button><div class="bell" data-go="action" title="Action Center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.8"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21h4"/></svg><b id="bellN">6</b></div>
    <div class="avatar">DW</div>
  </header>
  <div class="shell">
    <nav class="nav" id="nav"></nav>
    <div class="main" id="main"></div>
  </div>
  <footer class="foot"><span>Illustrative simulation. Synthetic data.</span><span>Clean-room, consent and FERPA handling is design intent, to be validated with Follett legal and each campus.</span></footer>
</div>
<button class="fab" id="fab" data-fab title="Ask Claude"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>
<div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div>
<script src="campus-data.js"></script>
<script>
/* ===== Campus AOS CFO prototype. All figures are synthetic, shaped like Follett objects. ===== */

      if(!initial){const e=(st.log&&st.log[0])||{};pushLog({a:'Synced from '+(e.surface||'another surface'),m:e.what||('Applied '+m.key),who:NFD.cfo.name,ag:agentName(m.ag),surface:e.surface||'',uc:m.uc,fx})}}
  });
  const cal=st.calendar||{};Object.keys(cal).forEach(id=>{if(S.cal[id]!==cal[id])S.cal[id]=cal[id]});

}

const ZONELBL={Follett:['Follett data','Visible to Follett and to you.'],University:['University data','School-official use only. Aggregate on this screen.'],CFO:['CFO-only','Never visible to Follett.'],Enriched:['Enriched with consent','Anonymized segments only.']};
function zoneFor(q){const s=q.toLowerCase();
  if(/(board|memo|draft|private|renew|rfp|compet|peer|strategy)/.test(s))return 'CFO';
  if(/(enrich|segment|interest)/.test(s))return 'Enriched';
  if(/(commission|statement|variance|pos\b|pop.?up|campaign|arena|event|calendar|collab|trade|alumni|golf|\bnil\b|service|dorm|delivery|invoice|dispute|expansion|proposal)/.test(s))return 'Follett';
  return 'University'}
function answer(q){
  const s=q.toLowerCase();
  for(const r of RULES){if(r.m.test(s)){const a=r.f(q);if(a)return a}}
  return null;
}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
let busy=false;
async function ask(q,where){
  q=(q||'').trim();if(!q||busy)return;
  const c=S.convs[S.ci];if(!c.msgs.length)c.title=q.length>38?q.slice(0,36)+'...':q;
  c.msgs.push({r:'u',text:q});
  let a=answer(q),live=null;
  if(!a&&window.cowork&&window.cowork.askClaude){
    live={steps:['Reasoning over live ledger context with Claude'],blocks:[]};
  }
  const m={r:'a',steps:(a||live||{steps:['Searching available views']}).steps,blocks:[],vs:0,vb:0};c.msgs.push(m);busy=true;
  refreshThreads();
  for(let i=0;i<m.steps.length;i++){await wait(520);m.vs=i+1;refreshThreads()}
  await wait(350);
  if(a){for(const b of a.blocks){m.blocks.push(b);m.vb=m.blocks.length;refreshThreads();await wait(420)}m.blocks.push({t:'zone',z:zoneFor(q)});m.vb=m.blocks.length;refreshThreads()}
  else if(live){
    try{const ctx=JSON.stringify({commission:CAT,disputes:S.disp.map(d=>({id:d.id,u:d.unit,c:d.cause,a:d.amt,s:d.st})),colleges:COLLEGES,gate:GATE,guarantee:GUAR});
      const r=await window.cowork.askClaude('You are the CFO copilot for Northfield State University. Answer concisely in plain prose using only this data. No em dashes. Question: '+q,[ctx]);
      m.blocks.push(P(String(typeof r==='string'?r:(r&&r.text)||r).replace(/\n/g,'<br>')))}catch(e){m.blocks.push(P('I could not reach the model just now.'))}
    m.vb=m.blocks.length;
  }else{
    m.blocks.push(P('I can answer questions about <b>commission</b>, <b>Access invoices</b>, <b>opt-outs</b>, <b>early signals</b>, <b>events</b>, <b>guarantee coverage</b>, <b>renewal</b> and <b>Total Access scenarios</b>. In the live build this question goes to Claude with your full ledger as context.'),F('What changed since Friday?','Why are Access invoices stuck?','How ready are we for renewal?'),SRC('Available views'),{t:'zone',z:zoneFor(q)});
    m.vb=m.blocks.length;m.steps=['Searching available views'];m.vs=1;
  }
  busy=false;refreshThreads();
}

function blockHTML(b){
  switch(b.t){
   case 'p':return `<div class="blk"><p>${b.h}</p></div>`;
   case 'stats':return `<div class="blk stats">${b.i.map(x=>`<div class="tile"><div class="l">${x[0]}</div><div class="v">${x[1]}</div><div class="s">${x[2]||''}</div></div>`).join('')}</div>`;
   case 'bars':return `<div class="blk card" style="padding:12px 14px">${b.i.map(x=>`<div style="margin:7px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${x[0]}</span><b>${typeof x[1]==='number'&&x[2]===15?x[1]+'%':fmtK(x[1])}</b></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,x[1]/x[2]*100))}%;background:${x[3]}"></i></div></div>`).join('')}</div>`;
   case 'tbl':return `<div class="blk tbl"><table><tr>${b.h.map(h=>`<th>${h}</th>`).join('')}</tr>${b.r.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
   case 'act':{const d=S.done[b.fx]&&b.fx!=='boardDoc';return `<div class="blk abox"><div class="t"><b>${b.title}</b><span>${d?'Done and logged. Nothing else needed.':b.desc}</span></div><button class="btn ${d?'done':'pri'}" ${d?'disabled':`data-fx="${b.fx}"`}>${d?'Done':b.label}</button></div>`}
   case 'fu':return `<div class="blk followups">${b.i.map(x=>`<button data-ask="${x}">${x}</button>`).join('')}</div>`;
   case 'zone':{const z=ZONELBL[b.z]||ZONELBL.University;return `<div class="blk"><span class="zone ${b.z}" title="${z[1]}">Zone: ${z[0]}</span> <span class="fine2">${z[1]}</span></div>`}
   case 'src':return `<div class="blk srcs">Sources: ${b.s.map(x=>`<span class="s">${x}</span>`).join('')}</div>`;
  }return '';
}
function msgHTML(m,last){
  if(m.r==='u')return `<div class="msg u"><div class="bub">${m.text.replace(/</g,'&lt;')}</div></div>`;
  const run=last&&busy;
  return `<div class="msg a"><div class="who"><span class="spark">${ico('bolt',11,'#fff')}</span>CLAUDE</div>
   <div class="trace">${m.steps.slice(0,Math.max(m.vs,run?1:m.steps.length)).map((s,i)=>`<div>${i<m.vs?`<span class="ok">&#10003;</span> `:`<span class="spin"></span>`}${s}</div>`).join('')}</div>${m.blocks.slice(0,m.vb).map(blockHTML).join('')}</div>`;
}

  const el=$('#thread-'+id);if(!el)return;

    const ps={home:[],action:['What changed since Friday?','Which decision is worth the most?'],fin:['Is our commission statement right?','What if the Parents Weekend lift is half?'],access:['Why are Access invoices stuck?','What if we move to Total Access?'],part:['How ready are we for renewal?','Draft the board summary'],trust:['Can you show student names?','What data do you use?']}[S.screen]||[];
    el.innerHTML=`<div class="greetp" style="font-size:15px;margin-top:6px">Ask me about what you are looking at. I know this screen's numbers and can take actions you approve.</div><div class="pchips" style="flex-direction:column;align-items:flex-start">${ps.map(p=>`<button class="pchip" data-ask="${p}">${p}</button>`).join('')}</div>`;return;

  $('#topTitle').textContent=TITLES[S.screen];
  $('#fab').classList.toggle('hide',S.screen==='home'||S.drawer);
  if($('#in-home'))$('#in-home').value=hv;
  refreshThreads();
}
function go(s){S.screen=s;S.col=null;if(s==='home')S.drawer=false;$('#drawer').classList.toggle('open',S.drawer&&s!=='home');renderAll();const p=$('.page');if(p)p.scrollTop=0;if(S.drawer&&s!=='home')buildDrawer()}
function openDrawer(){S.drawer=true;buildDrawer();$('#drawer').classList.add('open');$('#fab').classList.add('hide')}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-new],[data-hist],[data-conv],[data-ask],[data-fx],[data-dismiss],[data-col],[data-scen],[data-send],[data-fab],[data-dclose],[data-close],[data-copy],[data-tie],[data-reset],[data-cal],[data-calc],[data-calsave],[data-csv]');
  if(!t)return;const d=t.dataset;
  if(d.go!==undefined)return go(d.go);
  if('tie' in d){toast('Opening the student receipt beat.');try{window.parent.postMessage({campusosNav:'student',beat:'receipt'},'*')}catch(err){}return}
  if('reset' in d)return resetAll(false);
  if(d.cal)return calApprove(d.cal);
  if(d.calc){S.calOpen=S.calOpen===d.calc?null:d.calc;return renderAll()}
  if(d.calsave){const i=$('#calin-'+d.calsave);return calComment(d.calsave,i?i.value:'')}
  if(d.csv){if(d.csv==='audit')downloadCSV('northfield-audit-log.csv',auditCSV());else downloadCSV('anonymized-segments.csv',segmentsCSV());return toast('Export ready. '+(d.csv==='audit'?'Audit log':'Anonymized segments')+' downloaded.')}
  if('new' in d){S.convs.unshift(mkConv());S.ci=0;S.hist=false;if(S.screen==='home')renderAll();else{buildDrawer();refreshThreads()}return}
  if('hist' in d){S.hist=!S.hist;return renderAll()}
  if(d.conv!==undefined){S.ci=+d.conv;S.hist=false;return renderAll()}
  if(d.ask!==undefined){if(S.screen!=='home'&&!S.drawer){openDrawer()}return ask(d.ask)}
  if(d.fx){const wasDoc=d.fx==='boardDoc';act(d.fx);return}
  if(d.dismiss){S.dismissed[d.dismiss]=true;toast('Dismissed. I will resurface it if the numbers change.');return renderAll()}
  if(d.col!==undefined){const v=/^\d+$/.test(d.col)?+d.col:d.col;S.col=S.col===v?null:v;return renderAll()}
  if(d.scen){S.scen=d.scen;return renderAll()}
  if(d.send){const i=$('#in-'+d.send);const v=i.value;i.value='';return ask(v)}
  if('fab' in d)return openDrawer();
  if('dclose' in d){S.drawer=false;$('#drawer').classList.remove('open');$('#fab').classList.toggle('hide',S.screen==='home');return}
  if('close' in d)return $('#modalbg').classList.remove('on');
  if('copy' in d){navigator.clipboard&&navigator.clipboard.writeText($('.memo').innerText);return toast('Copied to clipboard')}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('in-')){const v=e.target.value;e.target.value='';ask(v)}});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.ta;if(!k)return;
  S.ta[k]=+e.target.value;const ta=S.ta,sales=ta.p*2*ta.e*(1-ta.o/100)/1e6,comm=sales*.08;
  e.target.parentNode.querySelector('b').textContent=k==='p'?'$'+ta.p:k==='e'?ta.e.toLocaleString():ta.o+'%';
  $('#ta-s').textContent='$'+sales.toFixed(1)+'M';$('#ta-c').textContent='$'+comm.toFixed(2)+'M';
  const dd=comm-0.692;$('#ta-d').textContent=(dd>=0?'+':'-')+'$'+Math.abs(dd).toFixed(2)+'M';$('#ta-d').style.color=dd>=0?'var(--green)':'var(--red)';
});
$('#modalbg').addEventListener('click',e=>{if(e.target.id==='modalbg')e.target.classList.remove('on')});
/* ---------- CSV exports ---------- */
const csvCell=v=>{let t=String(v==null?'':v);if(/^[=+\-@]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};
function auditCSV(){
  const rows=[['time','approved_by','agent','action','surface','use_case']].concat(S.log.map(l=>[l.t,l.who||'',l.ag||l.a,l.m,l.surface||'Command Center',l.uc||'']));
  return rows.map(r=>r.map(csvCell).join(',')).join('\n');
}
function segmentsCSV(){
  const rows=[['segment','students']].concat(ENR.segments.map(x=>[x[0],x[1]>=10?x[1]:'<10 (suppressed)']));
  return rows.map(r=>r.map(csvCell).join(',')).join('\n');
}
function downloadCSV(name,text){const b=new Blob([text],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
window.__cfo={auditCSV,segmentsCSV,S,act,resetAll,go};
/* ---------- shared state and parent protocol ----------
   Outbound to window.parent: {campusosNav:'student',beat:'receipt'} from the Student tie chip.
   Inbound from window.parent: {campusosCfo:{go:'home|action|fin|access|part|trust'}} or {campusosCfo:{cmd:'reset'}}.
   Shared approvals travel on CampusBus (BroadcastChannel + localStorage + postMessage relay). */
BUS.on((type,payload,st,remote)=>{if(!remote)return;if(type==='reset'){resetAll(true);return}syncFromBus(st,false);renderAll()});
window.addEventListener('message',e=>{const d=e.data&&e.data.campusosCfo;if(!d)return;if(d.go&&VIEWS[d.go])go(d.go);if(d.cmd==='reset')resetAll(false)});
syncFromBus(BUS.state(),true);
renderAll();
</script>
</body>
</html>
